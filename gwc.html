<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="stylesheet" type="text/css" href="css/gwc.css">
    <title>购物车</title>
</head>
<body>
    <h1>购物车</h1>

    <div class="shopping-cart">
        <div class="item">
            <img src="img/60p.jpg" alt="物品 1">
            <div class="item-details">
                <p>XINGRAO Tpua XT</p>
                <p>价格：¥49999.00</p>
                <button class="remove-item">移除</button>
            </div>
        </div>

        <div class="item">
            <img src="img/60.jpg" alt="物品 2">
            <div class="item-details">
                <p>XINGRAO Tpua XT pro</p>
                <p>价格： ¥ 59999.00</p>
                <button class="remove-item">移除</button>
            </div>
            
        </div>
        <div class="item">
            <img src="img/x5.jpg" alt="物品 3">
            <div class="item-details">
                <p>XINGRAO WATCH 5 pro</p>
                <p>价格： ¥ 300.00</p>
                <button class="remove-item">移除</button>
            </div>
            
        </div>
        <div class="item">
            <img src="#.jpg" alt="物品 4">
            <div class="item-details">
                <p>XINGRAO WATCH 5</p>
                <p>价格： ¥ 200.00</p>
                <button class="remove-item">移除</button>
            </div>
        


        <div class="total">
            <p>总计： ¥110498</p>
            <button class="checkout">结账</button>
        </div>
    </div>
    
        

    <script>
        // 添加移除物品的点击事件处理函数
        document.querySelectorAll('.remove-item').forEach(removeBtn => {
            removeBtn.addEventListener('click', function() {
                this.parentNode.remove();
            });
        });

        // 添加结账点击事件处理函数
        document.querySelector('.checkout').addEventListener('click', function() {
            alert(' 支付成功！');
        });
    </script>

</body>
</html>
