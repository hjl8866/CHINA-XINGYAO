<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星耀商城</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; color: #333; }

/* 顶部导航 */
.nav { background: linear-gradient(135deg, #667eea, #764ba2); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; color: #fff; position: sticky; top: 0; z-index: 100; }
.nav h2 { font-size: 18px; }
.nav-right { display: flex; gap: 15px; align-items: center; font-size: 14px; }
.nav-right a { color: #fff; text-decoration: none; opacity: 0.9; }
.nav-right a:hover { opacity: 1; }
.logout-btn { background: rgba(255,255,255,0.2); border: none; color: #fff; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }

/* 商品区 */
.container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
.section-title { margin: 20px 0 15px; font-size: 20px; font-weight: 600; }

.products { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
.product-card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); transition: transform 0.2s; }
.product-card:hover { transform: translateY(-4px); }
.product-img { width: 100%; height: 140px; background: linear-gradient(135deg, #667eea22, #764ba222); display: flex; align-items: center; justify-content: center; font-size: 48px; }
.product-info { padding: 12px; }
.product-title { font-size: 14px; font-weight: 500; margin-bottom: 6px; }
.product-price { color: #e74c3c; font-weight: 700; font-size: 16px; margin-bottom: 8px; }
.add-btn { width: 100%; padding: 8px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
.add-btn:active { transform: scale(0.97); }

/* 购物车侧栏 */
.cart-panel { position: fixed; right: -320px; top: 0; width: 320px; height: 100vh; background: #fff; box-shadow: -4px 0 12px rgba(0,0,0,0.1); transition: right 0.3s; z-index: 200; display: flex; flex-direction: column; }
.cart-panel.open { right: 0; }
.cart-header { padding: 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
.cart-header h3 { font-size: 16px; }
.close-cart { background: none; border: none; font-size: 20px; cursor: pointer; }
.cart-items { flex: 1; overflow-y: auto; padding: 15px; }
.cart-item { display: flex; gap: 10px; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #f0f0f0; }
.cart-item-img { width: 50px; height: 50px; background: #f0f0f0; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
.cart-item-info { flex: 1; }
.cart-item-title { font-size: 13px; margin-bottom: 4px; }
.cart-item-price { font-size: 13px; color: #e74c3c; font-weight: 600; }
.cart-item-qty { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.cart-item-qty button { width: 24px; height: 24px; border: 1px solid #ddd; background: #fff; border-radius: 4px; cursor: pointer; }
.cart-item-qty span { font-size: 13px; min-width: 20px; text-align: center; }
.cart-footer { padding: 20px; border-top: 1px solid #eee; }
.cart-total { font-size: 16px; font-weight: 600; margin-bottom: 10px; }
.checkout-btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; }
.checkout-btn:active { transform: scale(0.98); }

/* 遮罩 */
.overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); z-index: 150; }
.overlay.open { display: block; }

/* 消息提示 */
.toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 14px; z-index: 300; opacity: 0; transition: opacity 0.3s; }
.toast.show { opacity: 1; }

/* 空购物车 */
.empty-cart { text-align: center; padding: 40px 20px; color: #999; font-size: 14px; }

@media (max-width: 480px) {
  .products { grid-template-columns: repeat(2, 1fr); }
  .cart-panel { width: 100%; right: -100%; }
}
</style>
</head>
<body>

<!-- 登录态校验 -->
<script>
const token = localStorage.getItem('token');
if (!token) {
  window.location.href = '/login.html';
}
</script>

<!-- 顶部导航 -->
<div class="nav">
  <h2>🛍️ 星耀商城</h2>
  <div class="nav-right">
    <a href="javascript:void(0)" onclick="toggleCart()">🛒 购物车(<span id="cartCount">0</span>)</a>
    <span id="userEmail"></span>
    <button class="logout-btn" onclick="logout()">退出</button>
  </div>
</div>

<!-- 商品列表 -->
<div class="container">
  <div class="section-title">🔥 热门商品</div>
  <div class="products" id="products">
    <!-- 示例商品，你可以改成自己的 -->
    <div class="product-card">
      <div class="product-img">📱</div>
      <div class="product-info">
        <div class="product-title">星耀手机 Pro</div>
        <div class="product-price">¥3999</div>
        <button class="add-btn" onclick="addToCart('p001','星耀手机 Pro',3999,'📱')">加入购物车</button>
      </div>
    </div>
    <div class="product-card">
      <div class="product-img">💻</div>
      <div class="product-info">
        <div class="product-title">星耀笔记本 Air</div>
        <div class="product-price">¥5999</div>
        <button class="add-btn" onclick="addToCart('p002','星耀笔记本 Air',5999,'💻')">加入购物车</button>
      </div>
    </div>
    <div class="product-card">
      <div class="product-img">🎧</div>
      <div class="product-info">
        <div class="product-title">星耀耳机 Max</div>
        <div class="product-price">¥999</div>
        <button class="add-btn" onclick="addToCart('p003','星耀耳机 Max',999,'🎧')">加入购物车</button>
      </div>
    </div>
    <div class="product-card">
      <div class="product-img">⌚</div>
      <div class="product-info">
        <div class="product-title">星耀手表 S1</div>
        <div class="product-price">¥1499</div>
        <button class="add-btn" onclick="addToCart('p004','星耀手表 S1',1499,'⌚')">加入购物车</button>
      </div>
    </div>
  </div>
</div>

<!-- 购物车侧栏 -->
<div class="overlay" id="overlay" onclick="toggleCart()"></div>
<div class="cart-panel" id="cartPanel">
  <div class="cart-header">
    <h3>🛒 购物车</h3>
    <button class="close-cart" onclick="toggleCart()">×</button>
  </div>
  <div class="cart-items" id="cartItems">
    <div class="empty-cart">购物车是空的</div>
  </div>
  <div class="cart-footer">
    <div class="cart-total">合计：¥<span id="cartTotal">0</span></div>
    <button class="checkout-btn" onclick="checkout()">去结算</button>
  </div>
</div>

<!-- 消息提示 -->
<div class="toast" id="toast"></div>

<script>
// 显示用户邮箱
document.getElementById('userEmail').textContent = localStorage.getItem('email') || '';

// 购物车数据
let cart = [];

// 页面加载时拉取购物车
loadCart();

async function loadCart() {
  try {
    const res = await fetch('/api/cart', {
      headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
    });
    if (res.ok) {
      cart = await res.json();
      renderCart();
    }
  } catch (e) {
    console.log('加载购物车失败');
  }
}

async function addToCart(productId, title, price, image) {
  try {
    const res = await fetch('/api/cart', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + localStorage.getItem('token')
      },
      body: JSON.stringify({ product_id: productId, title, price, image })
    });
    const data = await res.json();
    if (res.ok) {
      showToast('已加入购物车');
      loadCart();
    } else {
      showToast(data.error || '添加失败');
    }
  } catch (e) {
    showToast('网络错误');
  }
}

function renderCart() {
  const container = document.getElementById('cartItems');
  const countEl = document.getElementById('cartCount');
  const totalEl = document.getElementById('cartTotal');

  if (!cart || cart.length === 0) {
    container.innerHTML = '<div class="empty-cart">购物车是空的</div>';
    countEl.textContent = '0';
    totalEl.textContent = '0';
    return;
  }

  let total = 0;
  let count = 0;
  container.innerHTML = cart.map(item => {
    total += item.price * item.quantity;
    count += item.quantity;
    return `
      <div class="cart-item">
        <div class="cart-item-img">${item.image || '📦'}</div>
        <div class="cart-item-info">
          <div class="cart-item-title">${item.title}</div>
          <div class="cart-item-price">¥${item.price}</div>
          <div class="cart-item-qty">
            <button onclick="updateQty('${item.product_id}', -1)">-</button>
            <span>${item.quantity}</span>
            <button onclick="updateQty('${item.product_id}', 1)">+</button>
          </div>
        </div>
      </div>
    `;
  }).join('');

  countEl.textContent = count;
  totalEl.textContent = total;
}

async function updateQty(productId, delta) {
  const item = cart.find(c => c.product_id === productId);
  if (!item) return;
  const newQty = item.quantity + delta;
  if (newQty <= 0) {
    // 删除
    await fetch('/api/cart', {
      method: 'DELETE',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + localStorage.getItem('token')
      },
      body: JSON.stringify({ product_id: productId })
    });
  } else {
    // 更新数量
    await fetch('/api/cart', {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + localStorage.getItem('token')
      },
      body: JSON.stringify({ product_id: productId, quantity: newQty })
    });
  }
  loadCart();
}

  if (!cart || cart.length === 0) {
    showToast('购物车是空的');
    return;
  }
  try {
    const res = await fetch('/api/checkout', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + localStorage.getItem(
