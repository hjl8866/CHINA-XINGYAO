<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星耀商城</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  min-height:100vh; color: rgba(255,255,255,0.9);
  background: radial-gradient(circle at 12% 15%, rgba(76,175,80,0.35), transparent 45%), radial-gradient(circle at 88% 12%, rgba(0,200,255,0.25), transparent 50%), radial-gradient(circle at 50% 85%, rgba(120,80,255,0.22), transparent 55%), linear-gradient(135deg, #0b0d17, #11142a, #0a0c1a);
  background-attachment: fixed; overflow-x:hidden;
}
.glass {
  background: rgba(255,255,255,0.08); backdrop-filter: saturate(180%) blur(24px); -webkit-backdrop-filter: saturate(180%) blur(24px);
  border: 1px solid rgba(255,255,255,0.18);
  box-shadow: 0 8px 32px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.15), inset 0 0 20px rgba(255,255,255,0.03);
}
header {
  background: rgba(0,0,0,0.25); backdrop-filter: saturate(180%) blur(28px); -webkit-backdrop-filter: saturate(180%) blur(28px);
  border-bottom: 1px solid rgba(255,255,255,0.1); padding: 14px 16px; position: sticky; top: 0; z-index: 100;
}
.header-inner { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
.logo { color:#fff; font-weight:600; font-size:16px; letter-spacing:1px; }
.hamburger { display:none; flex-direction:column; gap:4px; cursor:pointer; padding:8px; }
.hamburger span { display:block; width:22px; height:2px; background:#fff; border-radius:2px; transition:all 0.3s; }
header nav { display:flex; gap:6px; flex-wrap:wrap; }
header nav a { color:rgba(255,255,255,0.85); text-decoration:none; padding:6px 12px; border-radius:8px; font-size:13.5px; position:relative; }
header nav a:hover { color:#fff; background:rgba(255,255,255,0.12); }
#cartBadge { display:none; position:absolute; top:-6px; right:-8px; background:#ff3b30; color:#fff; border-radius:50%; font-size:10px; min-width:16px; height:16px; line-height:16px; text-align:center; font-weight:600; }
.nav-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); backdrop-filter:blur(4px); z-index:99; }
.nav-overlay.active { display:block; }
main { padding:30px 16px; max-width:1100px; margin:0 auto; }
section { padding:32px; border-radius:24px; }
section h2 { font-size:1.8rem; margin-bottom:24px; color:#fff; font-weight:600; }
section ul { list-style:none; display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:20px; }
section ul li { display:flex; flex-direction:column; align-items:center; padding:20px; border-radius:18px; transition:transform 0.25s; }
section ul li:hover { transform:translateY(-6px); box-shadow:0 16px 48px rgba(0,0,0,0.4); }
section ul li img { width:120px; height:120px; object-fit:cover; border-radius:16px; margin-bottom:16px; border:1px solid rgba(255,255,255,0.15); }
section ul li h3 { font-size:1.15rem; color:rgba(255,255,255,0.95); margin-bottom:14px; }
section ul li button { background:rgba(76,175,80,0.25); color:#fff; border:1px solid rgba(76,175,80,0.4); padding:9px 26px; border-radius:999px; cursor:pointer; font-size:0.95rem; }
section ul li button:hover { background:rgba(76,175,80,0.5); }
footer { background:rgba(0,0,0,0.28); backdrop-filter:blur(28px); border-top:1px solid rgba(255,255,255,0.1); color:rgba(255,255,255,0.7); text-align:center; padding:20px 16px; margin-top:40px; }
.toast { position:fixed; top:20px; left:50%; transform:translateX(-50%); padding:14px 24px; border-radius:12px; background:rgba(0,0,0,0.85); color:#fff; z-index:2000; display:none; font-size:14px; }
.toast.show { display:block; }
@media(max-width:768px){
  .hamburger{display:flex;}
  header nav{position:fixed;top:0;right:-280px;width:260px;height:100vh;flex-direction:column;padding:80px 20px 20px;background:rgba(0,0,0,0.88);backdrop-filter:blur(32px);transition:right 0.35s;z-index:101;}
  header nav.open{right:0;}
  header nav a{padding:14px 16px;font-size:15px;}
  section{padding:22px;}
  section ul{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;}
  section ul li img{width:90px;height:90px;}
}
</style>
</head>
<body>
<div class="nav-overlay" id="navOverlay" onclick="toggleNav()"></div>
<header>
<div class="header-inner">
  <div class="logo">星耀商城</div>
  <div class="hamburger" id="hamburger" onclick="toggleNav()"><span></span><span></span><span></span></div>
  <nav id="navMenu">
    <a href="fl.html">商品分类</a>
    <a href="yh.html">优惠活动</a>
    <a href="cart.html" style="position:relative;">我的购物车<span id="cartBadge">0</span></a>
    <a href="Orders.html">我的订单</a>
    <a href="ey.html">e邮商城</a>
    <a href="#" onclick="logout()">退出登录</a>
    <a href="ai.html">官方客服</a>
  </nav>
</div>
</header>
<main>
<section class="glass">
  <h2>热门商品</h2>
  <ul>
    <li><img src="xt.jpg"><h3>XINGRAO Tpua XT</h3><button onclick="addToCart('XINGRAO Tpua XT','xt.jpg',4999)">加入购物车</button></li>
    <li><img src="xt.jpg"><h3>XINGRAO Tpua XT pro</h3><button onclick="addToCart('XINGRAO Tpua XT pro','xt.jpg',5999)">加入购物车</button></li>
    <li><img src="17.jpg"><h3>XINGRAO WATCH 5 pro</h3><button onclick="addToCart('XINGRAO WATCH 5 pro','17.jpg',2999)">加入购物车</button></li>
    <li><img src="17.jpg"><h3>XINGRAO WATCH 5</h3><button onclick="addToCart('XINGRAO WATCH 5','17.jpg',1999)">加入购物车</button></li>
  </ul>
</section>
</main>
<footer><div><span>关于我们</span>|<span>联系我们</span>|<span>招聘信息</span></div><div><span>&copy; 星耀商城</span></div></footer>
<div class="toast" id="toast"></div>
<script>
function toggleNav(){document.getElementById('navMenu').classList.toggle('open');document.getElementById('hamburger').classList.toggle('active');document.getElementById('navOverlay').classList.toggle('active');}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function logout(){localStorage.removeItem('token');localStorage.removeItem('email');location.href='login.html';}

async function addToCart(name,img,price){
  const token=localStorage.getItem('token');
  if(!token){location.href='login.html';return;}
  await fetch('/api/cart',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({name,img,price,qty:1})});
  showToast('✅ 已加入购物车');
  loadCartBadge();
}

async function loadCartBadge(){
  const token=localStorage.getItem('token');
  if(!token)return;
  const res=await fetch('/api/cart',{headers:{'Authorization':'Bearer '+token}});
  const data=await res.json();
  const total=(data.data||[]).reduce((s,i)=>s+i.qty,0);
  const badge=document.getElementById('cartBadge');
  if(badge){badge.textContent=total;badge.style.display=total>0?'block':'none';}
}

document.addEventListener('DOMContentLoaded',loadCartBadge);
</script>
</body>
</html>
