<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>购物车 - 星耀商城</title>
<style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f5f5f5; }
    header { background: #333; color: #fff; text-align: center; padding: 10px; }
    header nav a { color: #fff; text-decoration: none; margin-right: 10px; }
    header nav span { color: #fff; margin-right: 10px; }
    header nav button { background: none; border: 1px solid #fff; color: #fff; padding: 2px 8px; cursor: pointer; font-size: 12px; }
    main { padding: 10px; }
    h2 { font-size: 1.5rem; margin-bottom: 10px; }
    .cart-list { list-style: none; padding: 0; margin: 0; }
    .cart-list li { display: flex; align-items: center; background: #fff; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #eee; }
    .cart-list li img { width: 80px; height: 80px; margin-right: 10px; object-fit: cover; }
    .cart-list li h3 { font-size: 1.1rem; margin: 0 0 5px 0; }
    .cart-list li .price { color: #e74c3c; font-weight: bold; margin-bottom: 5px; }
    .cart-list li .qty { display: flex; align-items: center; gap: 8px; }
    .cart-list li .qty button { background: #333; color: #fff; border: none; padding: 3px 10px; cursor: pointer; font-size: 14px; }
    .cart-list li .qty span { min-width: 20px; text-align: center; }
    .cart-list li .del { background: #e74c3c; color: #fff; border: none; padding: 4px 10px; cursor: pointer; font-size: 12px; margin-left: auto; }
    .total { text-align: right; font-size: 1.3rem; font-weight: bold; margin: 20px 0 10px; }
    .checkout-btn { width: 100%; background: #333; color: #fff; border: none; padding: 12px; cursor: pointer; font-size: 1.1rem; }
    .empty { text-align: center; color: #999; padding: 40px 0; }
    footer { background: #333; color: #fff; text-align: center; padding: 10px; margin-top: 20px; }
    footer div { margin-bottom: 5px; }
    footer div span { margin-right: 10px; }
    .msg { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 20px; border-radius: 6px; display: none; z-index: 999; }
</style>
</head>
<body>
<header>
    <nav id="nav"></nav>
</header>

<main>
    <h2>我的购物车</h2>
    <ul class="cart-list" id="cartList"></ul>
    <div class="total" id="total"></div>
    <button class="checkout-btn" onclick="checkout()">去结算</button>
</main>

<footer>
    <div><span>关于我们</span> | <span>联系我们</span> | <span>招聘信息</span></div>
    <div><span>&copy; 星耀商城</span></div>
</footer>

<div class="msg" id="msg"></div>

<script>
const email = localStorage.getItem('email');

const nav = document.getElementById('nav');
if (email) {
    nav.innerHTML = '<span>' + email + '</span> | <a href="x1.html">继续购物</a> | <button onclick="logout()">退出</button>';
} else {
    nav.innerHTML = '<a href="login.html">登录</a> | <a href="register.html">注册</a>';
    window.location.href = '/login.html';
}

let cartItems = [];

loadCart();

function loadCart() {
    if (!email) return;
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/api/cart?email=' + encodeURIComponent(email), true);
    xhr.onload = function() {
        if (xhr.status === 200) {
            cartItems = JSON.parse(xhr.responseText) || [];
            render();
        } else {
            render(true);
        }
    };
    xhr.onerror = function() { render(true); };
    xhr.send();
}

function render(err) {
    const list = document.getElementById('cartList');
    const totalEl = document.getElementById('total');

    if (err) { list.innerHTML = '<div class="empty">加载失败，请刷新重试</div>'; return; }

    if (cartItems.length === 0) {
        list.innerHTML = '<div class="empty">购物车是空的，<a href="x1.html">去逛逛</a></div>';
        totalEl.textContent = '';
        return;
    }

    let total = 0;
    list.innerHTML = cartItems.map(function(item) {
        total += item.price * item.quantity;
        return '<li>' +
            '<img src="' + (item.image || 'xt.jpg') + '" alt="' + item.title + '">' +
            '<div>' +
                '<h3>' + item.title + '</h3>' +
                '<div class="price">¥' + item.price + ' × ' + item.quantity + '</div>' +
                '<div class="qty">' +
                    '<button onclick="updateQty(\'' + item.product_id + '\',-1)">-</button>' +
                    '<span>' + item.quantity + '</span>' +
                    '<button onclick="updateQty(\'' + item.product_id + '\',1)">+</button>' +
                '</div>' +
            '</div>' +
            '<button class="del" onclick="removeItem(\'' + item.product_id + '\')">删除</button>' +
        '</li>';
    }).join('');

    totalEl.textContent = '合计：¥' + total;
}

function updateQty(productId, delta) {
    var item = cartItems.find(function(c) { return c.product_id === productId; });
    if (!item) return;
    var newQty = item.quantity + delta;
    if (newQty <= 0) { removeItem(productId); return; }

    var xhr = new XMLHttpRequest();
    xhr.open('PUT', '/api/cart?email=' + encodeURIComponent(email), true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.onload = function() { loadCart(); };
    xhr.send(JSON.stringify({ product_id: productId, quantity: newQty }));
}

function removeItem(productId) {
    var xhr = new XMLHttpRequest();
    xhr.open('DELETE', '/api/cart?email=' + encodeURIComponent(email), true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.onload = function() { loadCart(); };
    xhr.send(JSON.stringify({ product_id: productId }));
}

function checkout() {
    if (!cartItems.length) { showMsg('购物车是空的'); return; }

    var total = 0;
    cartItems.forEach(function(i) { total += i.price * i.quantity; });

    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/checkout?email=' + encodeURIComponent(email), true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.onload = function() {
        if (xhr.status === 200) {
            var data = JSON.parse(xhr.responseText);
            if (data.ok) {
                showMsg('下单成功！订单号：' + data.order_no);
                cartItems = [];
                render();
            } else {
                showMsg(data.error || '下单失败');
            }
        } else {
            showMsg('服务器错误: ' + xhr.status);
        }
    };
    xhr.onerror = function() { showMsg('网络错误，请重试（建议切手机流量）'); };
    xhr.send(JSON.stringify({ items: cartItems, total: total }));
}

function logout() {
    localStorage.removeItem('email');
    localStorage.removeItem('token');
    window.location.href = '/login.html';
}

function showMsg(text) {
    var el = document.getElementById('msg');
    el.textContent = text;
    el.style.display = 'block';
    setTimeout(function() { el.style.display = 'none'; }, 2500);
}
</script>
</body>
</html>
