<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>购物车</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .cart-title {
            font-size: 24px;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
        }
        .cart-item {
            display: flex;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }
        .item-img {
            width: 80px;
            height: 80px;
            background-color: #f0f0f0;
            border-radius: 4px;
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
        }
        .item-info {
            flex: 1;
        }
        .item-name {
            font-size: 18px;
            color: #333;
            margin-bottom: 5px;
        }
        .item-spec {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }
        .item-price {
            font-size: 16px;
            color: #e63946;
            font-weight: bold;
        }
        .item-num {
            font-size: 14px;
            color: #333;
        }
        .cart-total {
            text-align: right;
            margin: 20px 0;
            font-size: 18px;
        }
        .total-price {
            color: #e63946;
            font-weight: bold;
            font-size: 22px;
        }
        .pay-btn {
            display: block;
            width: 100%;
            height: 50px;
            line-height: 50px;
            text-align: center;
            background-color: #e63946;
            color: #fff;
            font-size: 18px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .pay-btn:hover {
            background-color: #c1121f;
        }
        /* 支付弹窗样式 */
        .pay-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        .modal-content {
            width: 90%;
            max-width: 400px;
            background: #fff;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
        }
        .modal-title {
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
        }
        .pay-input {
            width: 100%;
            height: 45px;
            padding: 0 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            margin-bottom: 20px;
            outline: none;
        }
        .pay-input:focus {
            border-color: #e63946;
        }
        .modal-btns {
            display: flex;
            gap: 10px;
        }
        .modal-btn {
            flex: 1;
            height: 45px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        .cancel-btn {
            background-color: #f0f0f0;
            color: #333;
        }
        .confirm-pay-btn {
            background-color: #e63946;
            color: #fff;
        }
        .tip {
            font-size: 12px;
            color: #999;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="cart-title">我的购物车</h2>
        <!-- 购物车商品列表 -->
        <div class="cart-item">
            <div class="item-img">商品图</div>
            <div class="item-info">
                <div class="item-name">无线蓝牙耳机</div>
                <div class="item-spec">白色 | 降噪款</div>
                <div class="item-price">¥299.00</div>
            </div>
            <div class="item-num">数量：1</div>
        </div>
        <div class="cart-item">
            <div class="item-img">商品图</div>
            <div class="item-info">
                <div class="item-name">星耀升天 X5 air2026 pro</div>
                <div class="item-spec">黑色 | 5T 16G</div>
                <div class="item-price">¥25999.00</div>
            </div>
            <div class="item-num">数量：2</div>
        </div>
        <!-- 购物车总价 -->
        <div class="cart-total">
            合计：<span class="total-price">¥26298.00</span>
        </div>
        <!-- 结算按钮 -->
        <button class="pay-btn" onclick="showPayModal()">去结算</button>
    </div>

    <!-- 支付弹窗 -->
    <div class="pay-modal" id="payModal">
        <div class="modal-content">
            <h3 class="modal-title">xing pay支付确认</h3>
            <input type="password" class="pay-input" id="payPassword" placeholder="请输入支付密码（初始：123456）">
            <div class="modal-btns">
                <button class="modal-btn cancel-btn" onclick="closePayModal()">取消</button>
                <button class="modal-btn confirm-pay-btn" onclick="checkPayPassword()">确认支付</button>
            </div>
            <div class="tip">支付成功后将跳转到首页</div>
        </div>
    </div>

    <script>
        // 显示支付弹窗
        function showPayModal() {
            document.getElementById('payModal').style.display = 'flex';
        }
        // 关闭支付弹窗
        function closePayModal() {
            document.getElementById('payModal').style.display = 'none';
            document.getElementById('payPassword').value = '';
        }
        // 验证支付密码
        function checkPayPassword() {
            const password = document.getElementById('payPassword').value.trim();
            const correctPassword = '123456'; // 初始支付密码
            if (password === correctPassword) {
                alert('支付成功');
                // 支付成功后跳转到首页x1.html
                window.location.href = 'x1.html';
            } else {
                alert('支付密码错误，请重新输入');
                document.getElementById('payPassword').value = '';
            }
        }
    </script>
</body>
</html>
