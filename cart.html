<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>购物车 - 星耀商城</title>
<style>
    body { font-family: sans-serif; background: #f5f5f5; margin: 0; padding: 0; }
    header { background: #333; color: #fff; padding: 10px; text-align: center; }
    header a { color: #fff; margin: 0 10px; text-decoration: none; }
    main { padding: 20px; }
    .cart-item { background: #fff; padding: 15px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
    .btn { background: #d9534f; color: #fff; border: none; padding: 8px 12px; cursor: pointer; border-radius: 4px; }
    .msg { position: fixed; top: 20px; right: 20px; background: yellow; color: red; padding: 10px; display: none; z-index: 999; }
</style>
</head>
<body>
<header>
    <div id="nav">加载中...</div>
</header>
<main>
    <h2>我的购物车</h2>
    <div id="cartList">加载中...</div>
    <button onclick="checkout()" style="margin-top:15px;padding:10px;width:100%;background:#5cb85c;color:#fff;border:none;border-radius:4px;">去结算</button>
</main>
<div class="msg" id="msg"></div>

<script>
// 1. 读取登录状态（统一：有 email 就算登录）
const email = localStorage.getItem('email');
const token = localStorage.getItem('token');

// 测试提示（确认完可删掉）
alert('cart页 -> email=' + email + ' | token=' + (token ? '有' : '无'));

// 2. 未登录拦截
if (!email) {
    alert('请先登录');
    window.location.href = '/login.html';
    throw new Error('未登录');
}

// 3. 渲染导航栏
document.getElementById('nav').innerHTML =
    '<span>' + email + '</span> | <a href="/x1.html">商城</a> | <button onclick="logout()">退出</button>';

function logout() {
    localStorage.removeItem('email');
    localStorage.removeItem('token');
    window.location.href = '/login.html';
}

// 4. 渲染购物车（这里先用 localStorage 模拟，若你用接口就替换 fetch）
const cart = JSON.parse(localStorage.getItem('cart_' + email) || '[]');
const list = document.getElementById('cartList');
if (cart.length === 0) {
    list.innerHTML = '<p>购物车空空如也，<a href="/x1.html">去逛逛</a></p>';
} else {
    list.innerHTML = cart.map((item, i) => `
        <div class="cart-item">
            <div>
                <h4>${item.title}</h4>
                <p>￥${item.price} × ${item.qty || 1}</p>
            </div>
            <button class="btn" onclick="del(${i})">删除</button>
        </div>
    `).join('');
}

function del(i) {
    cart.splice(i, 1);
    localStorage.setItem('cart_' + email, JSON.stringify(cart));
    location.reload();
}

function checkout() {
    if (cart.length === 0) { showMsg('购物车为空'); return; }
    alert('结算功能待对接，已登录用户：' + email);
}

function showMsg(t) {
    const m = document.getElementById('msg');
    m.textContent = t; m.style.display = 'block';
    setTimeout(() => m.style.display = 'none', 2000);
}
</script>
</body>
</html>
