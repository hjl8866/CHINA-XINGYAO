 <!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的购物车 - 星耀商城</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial, sans-serif;
  min-height:100vh; color:rgba(255,255,255,0.9);
  background: radial-gradient(circle at 12% 15%, rgba(76,175,80,0.35), transparent 45%), radial-gradient(circle at 88% 12%, rgba(0,200,255,0.25), transparent 50%), radial-gradient(circle at 50% 85%, rgba(120,80,255,0.22), transparent 55%), linear-gradient(135deg, #0b0d17, #11142a, #0a0c1a);
  background-attachment: fixed; padding:20px;
}
.glass {
  background:rgba(255,255,255,0.08); backdrop-filter:saturate(180%) blur(24px);
  border:1px solid rgba(255,255,255,0.18); border-radius:20px;
  box-shadow:0 8px 32px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.15);
}
.container{max-width:900px;margin:0 auto;}
h1{color:#fff;font-size:24px;margin-bottom:24px;text-align:center;font-weight:600;}
.empty{text-align:center;padding:60px 20px;color:rgba(255,255,255,0.5);}
.empty .icon{font-size:60px;margin-bottom:16px;}
.empty a{display:inline-block;color:#4CAF50;text-decoration:none;border:1px solid rgba(76,175,80,0.4);padding:10px 24px;border-radius:999px;margin-top:16px;}
.cart-list{padding:20px;}
.cart-item{display:flex;align-items:center;gap:16px;padding:16px;margin-bottom:12px;border-radius:14px;}
.cart-item:hover{transform:translateX(4px);}
.cart-item img{width:80px;height:80px;border-radius:12px;object-fit:cover;}
.item-info{flex:1;}
.item-info h3{font-size:15px;margin-bottom:6px;}
.item-info .price{color:#4CAF50;font-weight:600;}
.qty{display:flex;align-items:center;gap:10px;}
.qty button{width:28px;height:28px;border-radius:50%;border:1px solid rgba(255,255,255,0.2);cursor:pointer;background:rgba(255,255,255,0.1);color:#fff;font-size:16px;}
.delete{background:none;border:none;color:rgba(255,255,255,0.4);cursor:pointer;font-size:18px;}
.delete:hover{color:#ff3b30;}
.summary{padding:20px;margin-top:8px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(255,255,255,0.1);}
.total{font-size:18px;font-weight:500;}
.total span{color:#4CAF50;font-weight:700;font-size:22px;}
.checkout{background:rgba(76,175,80,0.3);color:#fff;border:1px solid rgba(76,175,80,0.5);padding:12px 32px;border-radius:999px;cursor:pointer;font-size:15px;font-weight:600;}
.checkout:hover{background:rgba(76,175,80,0.55);}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:14px 24px;border-radius:12px;background:rgba(0,0,0,0.85);color:#fff;z-index:2000;display:none;}
.toast.show{display:block;}
@media(max-width:600px){.cart-item{flex-wrap:wrap;}.summary{flex-direction:column;gap:12px;}}
</style>
</head>
<body>
<div class="container">
<h1>🛒 我的购物车</h1>
<div id="cartContent"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const token=localStorage.getItem('token');
if(!token)location.href='login.html';

function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

async function renderCart(){
  const res=await fetch('/api/cart',{headers:{'Authorization':'Bearer '+token}});
  const data=await res.json();
  const cart=data.data||[];
  const container=document.getElementById('cartContent');

  if(cart.length===0){
    container.innerHTML=`<div class="glass empty"><div class="icon">🛒</div><p>购物车还是空的</p><a href="x1.html">去逛逛 →</a></div>`;
    return;
  }

  let html='<div class="glass cart-list">';let total=0;
  cart.forEach((item,i)=>{
    total+=item.price*item.qty;
    html+=`<div class="cart-item"><img src="${item.product_img}"><div class="item-info"><h3>${item.product_name}</h3><div class="price">¥${item.price}</div></div><div class="qty"><button onclick="changeQty(${item.id},-1)">−</button><span>${item.qty}</span><button onclick="changeQty(${item.id},1)">+</button></div><button class="delete" onclick="removeItem(${item.id})">🗑️</button></div>`;
  });
  html+=`<div class="summary"><div class="total">合计：<span>¥${total}</span></div><button class="checkout" onclick="checkout(${total})">立即结算</button></div></div>`;
  container.innerHTML=html;
}

async function changeQty(id,delta){
  const cart=await(await fetch('/api/cart',{headers:{'Authorization':'Bearer '+token}})).json();
  const item=cart.data.find(i=>i.id===id);
  const newQty=item.qty+delta;
  await fetch('/api/cart',{method:'PUT',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({id,qty:newQty})});
  renderCart();
}

async function removeItem(id){
  await fetch('/api/cart?id='+id,{method:'DELETE',headers:{'Authorization':'Bearer '+token}});
  renderCart();showToast('已移除');
}

async function checkout(total){
  const res=await fetch('/api/cart',{headers:{'Authorization':'Bearer '+token}});
  const data=await res.json();
  const cart=data.data||[];
  const cres=await fetch('/api/checkout',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({items:cart,total})});
  const cdata=await cres.json();
  if(cdata.ok){showToast('✅ 结算成功！邮件已发送');renderCart();}
  else showToast('❌ 结算失败');
}

renderCart();
</script>
</body>
</html>
