<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册 - 星耀商城</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.container { background: #fff; border-radius: 16px; padding: 40px 30px; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
h1 { text-align: center; margin-bottom: 30px; color: #333; font-size: 24px; }
.form-group { margin-bottom: 20px; }
label { display: block; margin-bottom: 8px; color: #555; font-size: 14px; font-weight: 500; }
input { width: 100%; padding: 14px 16px; border: 2px solid #e1e1e1; border-radius: 10px; font-size: 16px; transition: border-color 0.3s; outline: none; }
input:focus { border-color: #667eea; }
button { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.2s; margin-top: 10px; }
button:hover { transform: translateY(-2px); }
button:active { transform: translateY(0); }
.msg { text-align: center; margin-top: 15px; font-size: 14px; padding: 10px; border-radius: 8px; display: none; }
.msg.success { display: block; background: #d4edda; color: #155724; }
.msg.error { display: block; background: #f8d7da; color: #721c24; }
.links { text-align: center; margin-top: 20px; font-size: 14px; }
.links a { color: #667eea; text-decoration: none; }
.links a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="container">
  <h1>📝 注册账号</h1>
  <form id="registerForm">
    <div class="form-group">
      <label for="email">邮箱</label>
      <input type="email" id="email" placeholder="请输入邮箱" required>
    </div>
    <div class="form-group">
      <label for="password">密码</label>
      <input type="password" id="password" placeholder="请输入密码（至少6位）" required minlength="6">
    </div>
    <button type="submit">注册</button>
  </form>
  <div class="msg" id="msg"></div>
  <div class="links">
    <a href="/login.html">已有账号？去登录</a>
  </div>
</div>

<script>
document.getElementById('registerForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const msg = document.getElementById('msg');

  msg.className = 'msg';
  msg.style.display = 'none';

  if (!email || !password) {
    msg.textContent = '请填写邮箱和密码';
    msg.className = 'msg error';
    msg.style.display = 'block';
    return;
  }

  if (password.length < 6) {
    msg.textContent = '密码至少6位';
    msg.className = 'msg error';
    msg.style.display = 'block';
    return;
  }

  try {
    const res = await fetch('/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (res.ok && data.ok) {
      msg.textContent = '注册成功！正在跳转登录页...';
      msg.className = 'msg success';
      msg.style.display = 'block';
      setTimeout(() => { window.location.href = '/login.html'; }, 1500);
    } else {
      msg.textContent = data.error || '注册失败';
      msg.className = 'msg error';
      msg.style.display = 'block';
    }
  } catch (err) {
    msg.textContent = '网络错误，请重试';
    msg.className = 'msg error';
    msg.style.display = 'block';
  }
});
</script>
</body>
</html>
