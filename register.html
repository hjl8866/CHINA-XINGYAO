<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册 - 星耀商城</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial, sans-serif;
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  background: linear-gradient(135deg, #0b0d17, #11142a, #0a0c1a);
}
.glass {
  background: rgba(255,255,255,0.08);
  backdrop-filter: saturate(180%) blur(24px);
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 20px; padding: 40px; width: 100%; max-width: 380px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}
.glass h2 { color:#fff; text-align:center; margin-bottom:24px; font-weight:600; }
.glass input {
  width:100%; padding:12px 14px; margin-bottom:12px;
  background: rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2);
  border-radius:10px; color:#fff; font-size:15px; outline:none;
}
.glass input::placeholder { color: rgba(255,255,255,0.4); }
.glass button {
  width:100%; padding:12px; margin-top:8px;
  background: rgba(76,175,80,0.3); border:1px solid rgba(76,175,80,0.5);
  color:#fff; border-radius:10px; font-size:15px; cursor:pointer; font-weight:600;
}
.glass button:hover { background: rgba(76,175,80,0.5); }
.links { text-align:center; margin-top:16px; }
.links a { color: rgba(255,255,255,0.6); font-size:13px; text-decoration:none; margin:0 8px; }
.links a:hover { color:#fff; }
.err { color:#ff6b6b; font-size:13px; text-align:center; margin-bottom:10px; min-height:18px; }
</style>
</head>
<body>
<div class="glass">
  <h2>注册账号</h2>
  <div class="err" id="err"></div>
  <input type="email" id="email" placeholder="邮箱">
  <input type="password" id="pwd" placeholder="密码（至少6位）">
  <button onclick="register()">注册</button>
  <div class="links">
    <a href="login.html">已有账号？去登录</a>
    <a href="x1.html">返回首页</a>
  </div>
</div>
<script>
async function register() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('pwd').value;
  const err = document.getElementById('err');
  if (!email || !password) { err.textContent = '请填写完整'; return; }
  if (password.length < 6) { err.textContent = '密码至少6位'; return; }
  const res = await fetch('/api/auth/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password })
  });
  const data = await res.json();
  if (data.ok) {
    localStorage.setItem('token', data.token);
    localStorage.setItem('email', data.email);
    alert('✅ 注册成功！');
    location.href = 'x1.html';
  } else {
    err.textContent = data.error;
  }
}
</script>
</body>
</html>
