<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        /* 页面背景样式（与登录页共用同一张背景） */
        body {
            background: url("1769921940488.jpeg") no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        /* 注册表单容器 */
        .register-box {
            width: 420px;
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.15);
        }
        .register-box h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }
        /* 输入框样式 */
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-size: 14px;
        }
        .input-group input {
            width: 100%;
            height: 45px;
            padding: 0 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        .input-group input:focus {
            border-color: #409eff;
        }
        /* 按钮样式 */
        .btn {
            width: 100%;
            height: 48px;
            background: #409eff;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 15px;
        }
        .btn:hover {
            background: #337ecc;
        }
        /* 跳转链接 */
        .link-box {
            text-align: center;
            font-size: 14px;
        }
        .link-box a {
            color: #409eff;
            text-decoration: none;
        }
        .link-box a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="register-box">
        <h2>用户注册</h2>
        <form id="registerForm">
            <div class="input-group">
                <label for="regUsername">用户名</label>
                <input type="text" id="regUsername" placeholder="请输入用户名" required>
            </div>
            <div class="input-group">
                <label for="regPassword">密码</label>
                <input type="password" id="regPassword" placeholder="请输入6-16位密码" required>
            </div>
            <div class="input-group">
                <label for="confirmPwd">确认密码</label>
                <input type="password" id="confirmPwd" placeholder="请再次输入密码" required>
            </div>
            <div class="input-group">
                <label for="phone">手机号</label>
                <input type="tel" id="phone" placeholder="请输入手机号" required>
            </div>
            <button type="submit" class="btn">注册</button>
        </form>
        <div class="link-box">
            已有账号？<a href="login.html">立即登录</a>
        </div>
    </div>

    <script>
        // 注册表单提交事件
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const pwd = document.getElementById('regPassword').value;
            const confirmPwd = document.getElementById('confirmPwd').value;
            
            // 简单密码一致性验证
            if (pwd !== confirmPwd) {
                alert('两次输入的密码不一致，请重新输入');
                return;
            }
            alert('注册成功，即将跳转到登录页');
            window.location.href = 'login.html'; // 注册成功跳回登录页
        });
    </script>
</body>
</html>
