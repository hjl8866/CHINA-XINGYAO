 
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户反馈页面</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>欢迎留下您的反馈</h1>
        <form id="commentForm">
            <textarea id="commentInput" placeholder="请输入您的反馈..."></textarea>
            <button type="submit">发表反馈</button>
        </form>
        <div id="commentsList" class="comments-list">
            <h2>反馈列表</h2>
            <!-- 评论将在这里显示 -->
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
