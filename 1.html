<head>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      min-height: 100vh;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      line-height: 1.8;
      color: rgba(255, 255, 255, 0.9);
      background:
        radial-gradient(circle at 15% 20%, rgba(76, 175, 80, 0.35), transparent 45%),
        radial-gradient(circle at 85% 15%, rgba(0, 212, 255, 0.28), transparent 50%),
        radial-gradient(circle at 50% 80%, rgba(120, 80, 255, 0.25), transparent 55%),
        linear-gradient(135deg, #0b0d17, #11142a, #0a0c1a);
      background-attachment: fixed;
      position: relative;
      overflow-x: hidden;
    }

    /* ========== 苹果玻璃核心 ========== */
    .glass {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: saturate(180%) blur(24px);
      -webkit-backdrop-filter: saturate(180%) blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.15),
        inset 0 0 20px rgba(255, 255, 255, 0.03);
    }

    /* ========== Header ========== */
    header {
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: saturate(180%) blur(28px);
      -webkit-backdrop-filter: saturate(180%) blur(28px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
      text-align: center;
      padding: 1.8rem 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      font-size: 32px;
      font-weight: 600;
      letter-spacing: 3px;
      text-shadow: 0 2px 24px rgba(76, 175, 80, 0.45);
    }

    /* ========== 导航 ========== */
    nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      background: rgba(76, 175, 80, 0.12);
      backdrop-filter: saturate(180%) blur(24px);
      -webkit-backdrop-filter: saturate(180%) blur(24px);
      border: 1px solid rgba(76, 175, 80, 0.25);
      border-radius: 18px;
      margin: 24px auto;
      max-width: 960px;
      padding: 14px;
      position: relative;
      z-index: 10;
      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    nav a {
      color: rgba(255, 255, 255, 0.9);
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 14.5px;
      font-weight: 500;
      transition: all 0.25s ease;
      white-space: nowrap;
      position: relative;
    }

    nav a:hover {
      background: rgba(76, 175, 80, 0.28);
      color: #ffffff;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(76, 175, 80, 0.35);
    }

    nav a:active {
      transform: translateY(0);
    }

    /* ========== 内容区块 ========== */
    section {
      margin: 22px auto;
      max-width: 960px;
      padding: 32px;
      border-radius: 24px;
      position: relative;
      z-index: 10;
      color: rgba(255, 255, 255, 0.88);
    }

    section h2 {
      color: #ffffff;
      margin-bottom: 16px;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
    }

    section p {
      color: rgba(255, 255, 255, 0.82);
      font-size: 15.5px;
      line-height: 1.9;
    }

    /* ========== Footer ========== */
    footer {
      background: rgba(0, 0, 0, 0.28);
      backdrop-filter: saturate(180%) blur(28px);
      -webkit-backdrop-filter: saturate(180%) blur(28px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.7);
      text-align: center;
      padding: 1.6rem;
      margin-top: 40px;
      position: relative;
      z-index: 10;
    }

    footer p {
      font-size: 13.5px;
      letter-spacing: 0.5px;
    }

    /* ========== 响应式 ========== */
    @media (max-width: 768px) {
      nav {
        flex-direction: column;
        align-items: stretch;
        margin: 16px;
        padding: 12px;
      }

      nav a {
        text-align: center;
        padding: 12px;
      }

      section {
        margin: 16px;
        padding: 24px;
        border-radius: 20px;
      }

      header h1 {
        font-size: 26px;
      }
    }
  </style>
</head>
