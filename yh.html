<!DOCTYPE html>
<html>
<head>
    	<meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="stylesheet" type="text/css" href="css/jm.css">
    <title>优惠</title>
</head>
<body>
    <h1>优惠活动</h1>

    <div class="offer">
        <h2>限时折扣</h2>
        <p>全场商品享受 <span>8 折</span> 优惠，快来抢购吧！</p>
        <button class="btn">立即购买</button>
    </div>

    <div class="offer">
        <h2>满减活动</h2>
        <p>购买商品满 <span>100 元</span> 减 <span>20 元</span>，满 <span>200 元</span> 减 <span>50 元</span>！</p>
        <button class="btn">立即购买</button>
    </div>

    <div class="offer">
        <h2>赠品活动</h2>
        <p>购买指定商品，即可获得精美赠品一份。</p>
        <button class="btn">立即购买</button>
    </div>

</body>
</html>
