<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的订单 - 星耀商城</title>
    <style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
    }

    header {
        background-color: #333;
        color: white;
        text-align: center;
        padding: 10px;
    }

    header nav a {
        color: white;
        text-decoration: none;
        margin-right: 10px;
    }

    header nav a:hover {
        color: #ccc;
    }

    header nav span {
        color: white;
        margin-right: 10px;
    }

    header nav button {
        background: none;
        border: 1px solid white;
        color: white;
        padding: 2px 8px;
        cursor: pointer;
        font-size: 12px;
    }

    main {
        padding: 10px;
    }

    h2 {
        font-size: 1.5rem;
        margin-bottom: 10px;
    }

    .order-list {
        list-style: none;
        padding: 0;
    }

    .order-item {
        background: #f9f9f9;
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 12px;
        margin-bottom: 12px;
    }

    .order-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
        padding-bottom: 8px;
        border-bottom: 1px solid #eee;
    }

    .order-no {
        font-size: 13px;
        color: #666;
    }

    .order-status {
        font-size: 12px;
        padding: 2px 8px;
        border-radius: 4px;
        background: #d4edda;
        color: #155724;
    }

    .order-status.pending {
        background: #fff3cd;
        color: #856404;
    }

    .order-items {
        margin-bottom: 8px;
    }

    .order-product {
        display: flex;
        align-items: center;
        margin-bottom: 6px;
    }

    .order-product img {
        width: 50px;
        height: 50px;
        margin-right: 10px;
    }

    .order-product .pname {
        font-size: 14px;
        flex: 1;
    }

    .order-product .pprice {
        font-size: 13px;
        color: #e74c3c;
        font-weight: bold;
    }

    .order-footer {
        text-align: right;
        font-size: 14px;
        font-weight: bold;
        padding-top: 8px;
        border-top: 1px solid #eee;
    }

    .order-time {
        font-size: 12px;
        color: #999;
        margin-top: 4px;
    }

    .empty {
        text-align: center;
        color: #999;
        padding: 40px 0;
    }

    .empty a {
        color: #333;
        text-decoration: underline;
    }

    footer {
        background-color: #333;
        color: white;
        text-align: center;
        padding: 10px;
        margin-top: 20px;
    }

    footer div {
        margin-bottom: 5px;
    }

    footer div span {
        margin-right: 10px;
    }
</style>
</head>
<body>
    <header>
        <nav id="nav"></nav>
    </header>

    <main>
        <h2>我的订单</h2>
        <ul class="order-list" id="orderList"></ul>
    </main>

    <footer>
        <div>
            <span>关于我们</span>
            |
            <span>联系我们</span>
            |
            <span>招聘信息</span>
        </div>
        <div>
            <span>&copy; 星耀商城</span>
        </div>
    </footer>

<script>
// 导航
const nav = document.getElementById('nav');
const token = localStorage.getItem('token');
const email = localStorage.getItem('email');

if (token && email) {
  nav.innerHTML = '<span>' + email + '</span> | <a href="x1.html">继续购物</a> | <a href="cart.html">购物车</a> | <button onclick="logout()">退出</button>';
} else {
  nav.innerHTML = '<a href="login.html">登录</a> | <a href="register.html">注册</a>';
  window.location.href = '/login.html';
}

// 加载订单
loadOrders();

async function loadOrders() {
  if (!token || !email) return;

  try {
    const res = await fetch('/api/orders?email=' + encodeURIComponent(email));
    const orders = await res.json();

    const list = document.getElementById('orderList');

    if (!orders || orders.length === 0) {
      list.innerHTML = '<div class="empty">暂无订单，<a href="x1.html">去逛逛</a></div>';
      return;
    }

    list.innerHTML = orders.map(order => {
      let items = [];
      try { items = JSON.parse(order.items || '[]'); } catch(e) {}

      const statusClass = order.status === 'pending' ? 'pending' : '';
      const statusText = order.status === 'paid' ? '已支付' : (order.status === 'pending' ? '处理中' : order.status);

      return '<li class="order-item">' +
        '<div class="order-header">' +
          '<span class="order-no">订单号：' + order.order_no + '</span>' +
          '<span class="order-status ' + statusClass + '">' + statusText + '</span>' +
        '</div>' +
        '<div class="order-items">' +
          items.map(item => '<div class="order-product">' +
            '<img src="' + (item.image || 'xt.jpg') + '" alt="">' +
            '<span class="pname">' + item.title + ' × ' + item.quantity + '</span>' +
            '<span class="pprice">¥' + (item.price * item.quantity) + '</span>' +
          '</div>').join('') +
        '</div>' +
        '<div class="order-footer">' +
          '合计：¥' + order.total +
          '<div class="order-time">' + (order.created_at || '') + '</div>' +
        '</div>' +
      '</li>';
    }).join('');
  } catch (e) {
    document.getElementById('orderList').innerHTML = '<div class="empty">加载失败，请刷新重试</div>';
  }
}

function logout() {
  localStorage.removeItem('token');
  localStorage.removeItem('email');
  window.location.href = '/login.html';
}
</script>
</body>
</html>
